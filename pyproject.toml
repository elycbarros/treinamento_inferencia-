[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treinamento-inferencia"
version = "0.1.0"
description = "Treinamento em inferência estatística aplicada à avaliação imobiliária com foco didático e NBR 14653."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Elydo Carmo Barros" }
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aulas*", "dominio*", "servicos*", "relatorios*"]
